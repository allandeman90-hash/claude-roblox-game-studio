# =============================================================================
# pixellab_plan.yaml — the 40 free PixelLab creations for Quete minute.
#
# Generator: PixelLab MCP  (server "pixellab", user scope, ✔ connected).
# Tool per asset: create_image_pixflux  = 1 generation each  -> 40 total.
# Do NOT use pro tools (create_image_pro / edit_image / inpaint_image =
# 20-40 generations each — one call would blow the whole free budget).
#
# ART DIRECTION (locked 2026-08-30):
#   - 3/4 view FACING THE VIEWER, not side profile (reads better small, no engine
#     mirroring). Pass direction="south", NOT view="side".
#   - Neutral standing idle pose only — the engine animates via bob + rotation +
#     (later) a lunge tween. Never a mid-action pose.
#   - Hero is STANDALONE: bare hands, no weapon, no shield in the sprite. Weapon
#     skins are a separate category, shown only in the equipment UI for v1.
#   - FUTURE: paper-doll layering — per-slot equip skins (tete/plastron/jambes/
#     pied + arme) will overlay and modify the base hero. Keep bases clean and
#     proportionally consistent between warrior and mage.
#
# WORKFLOW (pixellab MCP tools loaded):
#   1. mcp__pixellab__get_balance          -> confirm free generations remaining
#   2. for each asset below, in priority order:
#        mcp__pixellab__create_image_pixflux(description = <shared_style> + prompt,
#            width=<size>, height=<size>, no_background=true, direction="south",
#            outline="single color black outline", shading="medium shading",
#            detail="medium detail")
#        -> returns a job id
#   3. mcp__pixellab__get_image(job_id)     -> PNG url ; download to out_raw/pixellab/<id>.png
#   4. (optional, 0.1 gen) mcp__pixellab__unzoom_image / correct_pixelart to tidy
#   5. copy/scale into assets/images/<category>/<id>.png   (already true pixel art,
#      so postprocess.py is only needed for final resize/quantize if sizes differ)
#   6. upload.py  -> AssetMap.luau
#
# Track progress in the `done:` list at the bottom.
# =============================================================================

shared_style: >-
  cohesive fantasy RPG game sprite, single centered subject, full body,
  3/4 view facing the viewer, neutral standing idle pose,
  vibrant limited palette, clean readable silhouette, no ground shadow

defaults:
  size: 64          # heroes / pets / monsters
  boss_size: 96     # big bosses read larger in the scene

# --------------------------------------------------------------- HEROES (2)
heroes:
  - { id: hero_warrior, prompt: "young knight, blue steel plate armor, brown hair, empty hands, no weapon, no shield, relaxed combat-ready stance" }
  - { id: hero_mage,    prompt: "young mage, deep purple hooded robe with gold trim, hood up, empty hands, no staff, relaxed stance" }

# --------------------------------------------------------------- PET FAIRIES (3)
# Glowing orb / wisp companions. Role = colour.
pets:
  - { id: pet_tank, prompt: "glowing blue fairy wisp, round luminous crystal-blue core, soft protective sky-blue aura, tiny translucent wings, calm" }
  - { id: pet_heal, prompt: "glowing green fairy wisp, round luminous emerald core, gentle green aura, drifting sparkles, tiny translucent wings, serene" }
  - { id: pet_dps,  prompt: "glowing red fairy wisp, round luminous crimson core, fierce red-orange flare aura, sharp ember spikes, tiny translucent wings, aggressive" }

