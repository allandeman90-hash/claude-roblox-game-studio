# =============================================================================
# style.yaml — ComfyUI connection + shared pixel-art style + seed policy.
# Read by generate.py and postprocess.py. No game data here.
# =============================================================================

comfyui:
  url: "http://127.0.0.1:8188"
  workflow: "workflow_api.json"

  # Model files — must match the names shown in ComfyUI's dropdowns exactly.
  # Leave `lora` empty ("") to render without the pixel-art LoRA (generate.py
  # rewires the graph automatically).
  checkpoint: "sd_xl_base_1.0.safetensors"
  lora: "pixel-art-xl.safetensors"
  lora_strength: 1.0
  vae: "sdxl_vae.safetensors"          # "" -> use the VAE baked into the checkpoint

  # Node-id -> role map for workflow_api.json. Update if you drop in your own
  # API-format export (ids are visible in the JSON).
  nodes:
    checkpoint: "4"
    lora: "10"
    positive: "6"
    negative: "7"
    latent: "5"
    sampler: "3"
    vae: "11"
    save: "9"

  # Render resolution BEFORE the nearest-neighbour downscale in postprocess.
  # SDXL + Pixel Art XL -> 1024.  SD1.5 route -> 512.
  gen_size: 1024

  sampler:
    steps: 22
    cfg: 7.0
    sampler_name: "euler"
    scheduler: "normal"

  # Seconds between /history polls, and how long before a job is abandoned.
  poll_interval: 1.5
  timeout: 240

style:
  # Appended to sprite prompts (bg: magenta / rembg). {bg_clause} filled per-asset.
  positive_suffix: >-
    , single subject, one sprite only, full figure in frame, pixel art,
    16-bit game sprite, crisp clean hard pixels, limited palette,
    high contrast, thick dark outline, strong readable silhouette,
    no background scenery, {bg_clause}

  # Appended instead for scene backgrounds (bg: keep) — no silhouette framing.
  positive_suffix_scene: >-
    , pixel art, 16-bit, crisp clean pixels, limited palette,
    seamless horizontal tiling, no transparent areas, {bg_clause}

  negative: >-
    blurry, anti-aliased, soft edges, smooth shading, gradient, bloom,
    jpeg artifacts, photorealistic, 3d render, realistic lighting,
    depth of field, text, signature, watermark, frame, border,
    character sheet, reference sheet, sprite sheet, turnaround,
    multiple poses, multiple views, multiple angles, side panels,
    item icons, inventory grid, cast shadow, drop shadow, ground shadow,
    multiple subjects, duplicate, (floating weapon:1.4), (held weapon:1.4),
    (weapon in hand:1.4), (outstretched arm:1.3), weapon pointing away,
    weapon on a stand, weapon display, detached object, extra limbs

  bg_magenta_clause: "solid flat magenta #FF00FF background, subject fully inside frame"
  bg_rembg_clause: "plain flat neutral background"

  # per_category  -> same base seed for every asset in a category (cohesion)
  # per_asset     -> deterministic seed hashed from the asset id (variety)
  # fixed         -> one seed for the whole run (see seed_fixed)
  seed_mode: "per_category"
  seed_fixed: 777

postprocess:
  # Colours kept after quantisation (per image). Lower = flatter pixel-art look.
  palette_colors: 24
  # Magenta keying tolerance (0-255 Euclidean-ish per channel).
  magenta_tolerance: 60
  # Pixels with alpha below this after keying are snapped to fully transparent.
  alpha_cutoff: 24
  # Transparent margin (in final pixels) kept around the cropped subject.
  pad: 2
