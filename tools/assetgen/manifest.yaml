      - { id: boss_sentinelle_ancienne, prompt: "ancient stone sentinel construct, cracked runic armor, dim blue glow" }
      - { id: boss_adepte_corrompu,    prompt: "corrupted robed cultist, purple void energy in both hands, floating" }
      - { id: boss_brute_elite,        prompt: "hulking brute ogre, spiked iron gauntlets, scarred, roaring" }
      - { id: boss_invocateur_errant,  prompt: "wandering summoner in tattered green robes, spectral wisps orbiting, staff" }

  # ---------------------------------------------------------------- BIG BOSSES (12, GAME_SPEC 6.2)
