      - { id: boss_behemoth,         prompt: "colossal horned behemoth, thick hide, ground-cracking stomp, bone plating" }  # km 80
      - { id: boss_spectre_hurlant,  prompt: "screaming wraith, tattered ghost shroud, hollow glowing maw, spectral chains" } # km 90
