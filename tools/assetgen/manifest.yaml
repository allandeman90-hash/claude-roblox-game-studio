# =============================================================================
# manifest.yaml — every asset the game needs, declaratively.
#
#   generate.py   reads `prompt` (+ category prompt_prefix + style suffix)
#   postprocess.py reads `size` / `bg`
#   upload.py     uses <category>/<id> as the AssetMap key  ->  AssetMap["<id>"]
#
# Per-item keys (all optional except id + prompt):
#   id        unique slug — becomes the AssetMap key and the PNG filename
#   prompt    subject description (English prompts render best)
#   size      final px (32 or 64). Inherits category.defaults.size
#   bg        "magenta" (default) | "rembg" | "keep"
#   seed      override the computed seed for this one asset
#
# Category keys:
#   prompt_prefix   prepended to every item prompt ({v} = per-voie token, unused by default)
#   defaults        { size, bg } inherited by items
# =============================================================================

defaults:
  size: 64
  bg: rembg          # semantic cutout — handles interior light areas + cast shadows
  isolate: true      # keep only the largest connected blob (kills floating islands)

categories:

  # ---------------------------------------------------------------- HERO
  hero:
    prompt_prefix: "one single game character, full body, standing still facing the viewer, ((arms folded across the chest)), calm neutral pose, "
    defaults: { size: 64 }
    items:
      - { id: hero_warrior, prompt: "young knight in blue steel plate armor, brown hair, sword and round shield sheathed on the back" }
      - { id: hero_mage,    prompt: "young mage in a deep purple hooded robe with gold trim, hood up, wooden staff sheathed on the back" }

  # ---------------------------------------------------------------- PETS (12)
  pets:
    prompt_prefix: "small cute RPG companion creature sprite, side view, floating or trotting beside the hero, "
    defaults: { size: 64 }
    items:
      - { id: pet_pingouin, prompt: "chubby penguin with a tiny scarf" }
      - { id: pet_renard,   prompt: "orange fox with a bushy tail, alert" }
      - { id: pet_faucon,   prompt: "brown falcon, wings half-spread, fierce eyes" }
      - { id: pet_panthere, prompt: "sleek black panther cub, green eyes, crouched" }
      - { id: pet_tortue,   prompt: "green turtle with a mossy rocky shell" }
      - { id: pet_blaireau,  prompt: "grey badger, stocky, striped face, digging claws" }
      - { id: pet_rhino,    prompt: "armored baby rhino, thick grey plates, single horn" }
      - { id: pet_ours,     prompt: "brown bear cub, standing on hind legs" }
      - { id: pet_luciole,  prompt: "giant glowing firefly, warm yellow abdomen light, translucent wings" }
      - { id: pet_meduse,   prompt: "small translucent blue jellyfish, bioluminescent, drifting tendrils" }
      - { id: pet_licorne,  prompt: "white unicorn foal, pastel rainbow mane, spiral horn, faint sparkle" }
      - { id: pet_phenix,   prompt: "fiery phoenix chick, orange and gold flames for feathers, ember trail" }

  # ---------------------------------------------------------------- ZONE 1 ENEMIES
  enemies_zone1:
    prompt_prefix: "RPG monster enemy sprite, side view facing left, aggressive pose, "
    defaults: { size: 64 }
