  # ---------------------------------------------------------------- ZONE DECOR LAYERS
  # One tiling strip per parallax layer per zone. Wide aspect; bg kept opaque.
  decor:
    prompt_prefix: "seamless horizontally-tiling pixel art background strip, wide panorama, "
    defaults: { size: 64, bg: keep, isolate: false }
    items:
