      - { id: weapon_colosse_cendres, prompt: "obsidian greatsword, lava seeping from the fuller" }
      - { id: weapon_liche_glaciale, prompt: "frozen bone scepter, blue soul-flame crystal" }
      - { id: weapon_tyran_abysses, prompt: "coral-encrusted war trident, dripping dark water" }
      - { id: weapon_archimage_dechu, prompt: "floating shattered tome bound in violet chains" }
      - { id: weapon_behemoth,      prompt: "massive bone club studded with horn spikes" }
      - { id: weapon_spectre_hurlant, prompt: "ghostly curved dagger, trailing spectral mist" }
      - { id: weapon_dragon_fer,    prompt: "riveted iron greatsword venting steam" }
