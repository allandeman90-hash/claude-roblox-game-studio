      - { id: boss_colosse_cendres,  prompt: "ash colossus, cracked obsidian body oozing lava, ember storm" }              # km 40
      - { id: boss_liche_glaciale,   prompt: "frost lich, skeletal, frozen crown, blue soul-fire, ice shards orbiting" }   # km 50
      - { id: boss_tyran_abysses,    prompt: "abyssal tyrant, deep-sea armored beast, barnacle plates, trident, dark water" } # km 60
